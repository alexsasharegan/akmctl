name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  packaging:
    # scripts/release.sh builds a dummy version; scripts/install.sh installs it from the local archive.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: release archives
        run: SKIP_TESTS=1 scripts/release.sh 0.0.0-ci
      - name: install from the archive
        run: |
          dir="$RUNNER_TEMP/bin"
          AKMCTL_BASE_URL="file://$PWD/dist/0.0.0-ci" AKMCTL_VERSION=0.0.0-ci AKMCTL_INSTALL_DIR="$dir" sh scripts/install.sh
          "$dir/akmctl" version | grep -q '^akmctl 0.0.0-ci '
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AKM_REQUIRE_TOOLS: "1" # a missing git, node or sh fails its tests instead of skipping them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: records
        if: runner.os == 'Linux'
        run: go build -o "$RUNNER_TEMP/akmctl" ./cmd/akmctl && "$RUNNER_TEMP/akmctl" check
      - name: node tools
        if: runner.os == 'Linux'
        run: npm ci --no-fund --no-audit
      - name: format records
        if: runner.os == 'Linux'
        run: npm run format:check
      - name: api schemas
        if: runner.os == 'Linux'
        run: npm run schemas
      - run: go test ./...
      - name: race
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: windows smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\akmctl.exe" ./cmd/akmctl
          pwsh -NoProfile -File scripts/windows-smoke.ps1 -Exe "$env:RUNNER_TEMP\akmctl.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: windows zip install (README steps)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run the README's PowerShell block as a user would, with a token only to avoid the API rate limit.
          $readme = Get-Content -Raw README.md
          $m = [regex]::Match($readme, '(?s)### Windows\r?\n.*?```powershell\r?\n(.*?)```')
          if (-not $m.Success) { throw "README has no Windows PowerShell block" }
          $block = $m.Groups[1].Value
          $script = Join-Path $env:RUNNER_TEMP 'install-from-readme.ps1'
          "`$PSDefaultParameterValues['Invoke-RestMethod:Headers'] = @{ Authorization = 'Bearer ' + `$env:GH_TOKEN }" | Set-Content $script
          Add-Content $script $block
          Add-Content $script 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
          pwsh -NoProfile -File $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A new shell finds akmctl through the user PATH the block wrote.
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','User') + ';' + [Environment]::GetEnvironmentVariable('PATH','Machine')
          akmctl version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The checksum check must fail on a damaged download.
          $bad = $block -replace '\$got = \(Get-FileHash[^\r\n]*', '$got = "0000"'
          if ($bad -eq $block) { throw "could not build the damaged-download case" }
          $badScript = Join-Path $env:RUNNER_TEMP 'install-bad.ps1'
          "`$PSDefaultParameterValues['Invoke-RestMethod:Headers'] = @{ Authorization = 'Bearer ' + `$env:GH_TOKEN }" | Set-Content $badScript
          Add-Content $badScript $bad
          pwsh -NoProfile -File $badScript 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -eq 0) { throw "a checksum mismatch did not stop the install" }
          Write-Host "the damaged download was refused (exit $LASTEXITCODE), as it must be"
          exit 0
      - name: winget manifests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Package the published release v0.3.3 (a fixed fixture), validate and install it from the local files.
          $tmp = $env:RUNNER_TEMP
          gh release download v0.3.3 --repo alexsasharegan/akmctl --pattern SHA256SUMS --output "$tmp/SHA256SUMS"
          bash scripts/winget-manifests.sh v0.3.3 "$tmp/SHA256SUMS" "$tmp/winget"
          Get-ChildItem "$tmp/winget" | Select-Object -ExpandProperty Name
          $w = Get-Command winget -ErrorAction SilentlyContinue
          if (-not $w) { Write-Host "winget is not installed on this runner"; exit 0 }
          winget --version
          winget validate --manifest "$tmp/winget"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          winget settings --enable LocalManifestFiles
          winget install --manifest "$tmp/winget" --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','User') + ';' + [Environment]::GetEnvironmentVariable('PATH','Machine')
          akmctl version
      - name: homebrew formula
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          # Package the published release v0.3.3 (a fixed fixture) and install it from a local tap.
          if ! command -v brew >/dev/null 2>&1 && [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          gh release download v0.3.3 --repo alexsasharegan/akmctl --pattern SHA256SUMS --output "$RUNNER_TEMP/SHA256SUMS"
          scripts/homebrew-formula.sh v0.3.3 "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/akmctl.rb"
          ruby -c "$RUNNER_TEMP/akmctl.rb"
          if ! command -v brew >/dev/null 2>&1; then echo "brew is not installed on this runner"; exit 0; fi
          brew tap-new --no-git local/akm
          mkdir -p "$(brew --repository local/akm)/Formula"
          cp "$RUNNER_TEMP/akmctl.rb" "$(brew --repository local/akm)/Formula/"
          brew install local/akm/akmctl
          akmctl version
