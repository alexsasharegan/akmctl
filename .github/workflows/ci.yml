name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: records
        if: runner.os == 'Linux'
        run: go build -o "$RUNNER_TEMP/akmctl" ./cmd/akmctl && "$RUNNER_TEMP/akmctl" check
      - name: node tools
        if: runner.os == 'Linux'
        run: npm ci --no-fund --no-audit
      - name: format records
        if: runner.os == 'Linux'
        run: npm run format:check
      - name: api schemas
        if: runner.os == 'Linux'
        run: npm run schemas
      - run: go test ./...
      - name: race
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: winget manifests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Package the published release v0.3.3 (a fixed fixture), validate and install it from the local files.
          $tmp = $env:RUNNER_TEMP
          gh release download v0.3.3 --repo alexsasharegan/akmctl --pattern SHA256SUMS --output "$tmp/SHA256SUMS"
          bash scripts/winget-manifests.sh v0.3.3 "$tmp/SHA256SUMS" "$tmp/winget"
          Get-ChildItem "$tmp/winget" | Select-Object -ExpandProperty Name
          $w = Get-Command winget -ErrorAction SilentlyContinue
          if (-not $w) { Write-Host "winget is not installed on this runner"; exit 0 }
          winget --version
          winget validate --manifest "$tmp/winget"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          winget settings --enable LocalManifestFiles
          winget install --manifest "$tmp/winget" --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','User') + ';' + [Environment]::GetEnvironmentVariable('PATH','Machine')
          akmctl version
      - name: homebrew formula
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          # Package the published release v0.3.3 (a fixed fixture) and install it from a local tap.
          if ! command -v brew >/dev/null 2>&1 && [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          gh release download v0.3.3 --repo alexsasharegan/akmctl --pattern SHA256SUMS --output "$RUNNER_TEMP/SHA256SUMS"
          scripts/homebrew-formula.sh v0.3.3 "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/akmctl.rb"
          ruby -c "$RUNNER_TEMP/akmctl.rb"
          if ! command -v brew >/dev/null 2>&1; then echo "brew is not installed on this runner"; exit 0; fi
          brew tap-new --no-git local/akm
          mkdir -p "$(brew --repository local/akm)/Formula"
          cp "$RUNNER_TEMP/akmctl.rb" "$(brew --repository local/akm)/Formula/"
          brew install local/akm/akmctl
          akmctl version
