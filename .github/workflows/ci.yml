name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: records
        if: runner.os == 'Linux'
        run: go build -o "$RUNNER_TEMP/akmctl" ./cmd/akmctl && "$RUNNER_TEMP/akmctl" check
      - name: format records
        if: runner.os == 'Linux'
        run: npx --yes prettier@3.9.10 --check AGENTS.md CHANGELOG.md README.md "docs/**/*.md"
      - run: go test ./...
      - name: race
        if: runner.os == 'Linux'
        run: go test -race ./...
